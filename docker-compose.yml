# Untested template: Airflow standalone with the project mounted. Open http://localhost:8080 (credentials printed in logs).
services:
  airflow:
    image: apache/airflow:2.9.3
    command: standalone
    ports: ["8080:8080"]
    environment: {_PIP_ADDITIONAL_REQUIREMENTS: "pandas numpy"}
    volumes: ["./dags:/opt/airflow/dags", ".:/opt/airflow/project"]
